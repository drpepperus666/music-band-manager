{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>{% block title %}Bandly{% endblock %}</title>
 <link
 rel="stylesheet"
 href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
 >
 <link
 rel="stylesheet"
 href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css"
 >
 <link
 rel="stylesheet"
 href="{% static 'homepage/css/style.css' %}"
 >
</head>
<body>
 <header class="site-header">
 <a href="{% url 'homepage:index' %}" class="bandly-logo-link" aria-label="На главную">
 <img
 src="{% static 'homepage/img/logo.png' %}"
 alt="Bandly"
 class="bandly-logo"
 >
 </a>
 {% include "includes/navigation.html" %}
 </header>
 <main class="container">
 {% block content %}
 {% endblock %}
 </main>
 <footer class="container mt-4 mb-3">
 <p>
 © <span id="current-year"></span> {{ site_name|default:"Bandly" }}
 </p>
 </footer>
 <script src="{% static 'homepage/js/main.js' %}"></script>
 <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ru.js"></script>
 <script>
 document.querySelectorAll(".bandly-date").forEach(function (el) {
  flatpickr(el, { dateFormat: "Y-m-d", allowInput: true, locale: "ru" });
 });
 </script>
</body>
</html>
