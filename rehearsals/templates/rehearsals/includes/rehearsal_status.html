{% if rehearsal.status == "cancelled" %}
 <span class="badge bg-secondary rehearsal-status rehearsal-status-cancelled">
 Отменена
 </span>
{% elif rehearsal.status == "completed" %}
 <span class="badge bg-info rehearsal-status rehearsal-status-completed">
 Завершена
 </span>
{% elif rehearsal.status == "active" %}
 <span class="badge bg-success rehearsal-status rehearsal-status-active">
 Активна
 </span>
{% else %}
 <span class="badge bg-warning rehearsal-status rehearsal-status-unknown">
 Статус неизвестен
 </span>
{% endif %}
